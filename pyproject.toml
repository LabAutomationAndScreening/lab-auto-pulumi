[project]
name = "lab-auto-pulumi"
version = "0.2.3"
description = "Pulumi helpers. Especially useful for tooling created by the LabAutomationAndScreening github organization."
authors = [
    {name = "Eli Fine"},

]
readme = "README.md"
requires-python = ">=3.12.7"
classifiers = [
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.12",

    "Programming Language :: Python :: 3.13",

    "Programming Language :: Python :: 3.14",

]
dependencies = [
    "pulumi>=3.264.0",
    "pulumi-aws>=7.48.0",
    "pulumi-aws-native>=1.80.0",
    "ephemeral-pulumi-deploy>=0.0.7",
    "boto3>=1.43.101",
    "boto3-stubs[ssm]>=1.43.101",
    "pydantic>=2.13.5",
]


[dependency-groups]
dev = [
    # Specific to this repository
    "boto3-stubs[all]", # version specification is in main dependencies already
    "faker>=40.39.0",

    # Managed by upstream template
    "pyright>=1.1.414",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "mutmut>=3.8.0",
]

[tool.setuptools]
license-files = [] # kludge until this bug is fixed https://github.com/pypa/setuptools/issues/4759

[tool.uv]
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
